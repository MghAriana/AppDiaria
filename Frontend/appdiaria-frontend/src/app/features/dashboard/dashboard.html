<div class="container-fluid">
  <div class="mb-4">
    <h2 class="fw-bold">
      <i class="bi bi-house-fill me-2"></i>
      Bienvenida a AppDiaria
    </h2>

    <p class="text-muted">Organizá tus tareas, rutinas y objetivos diarios.</p>
  </div>

  <div class="row g-4">
    <div class="col-md-6 col-lg-3">
      <div class="card shadow-sm h-100">
        <div class="card-body">
          <i class="bi bi-check2-square fs-2"></i>

          <h5 class="card-title mt-3">Tareas</h5>

          <p class="card-text">5 tareas pendientes</p>

          <button class="btn btn-app" routerLink="/app/tareas">Ver tareas</button>
        </div>
      </div>
    </div>

    <div class="col-md-6 col-lg-3">
      <div class="card shadow-sm h-100">
        <div class="card-body">
          <i class="bi bi-activity fs-2"></i>

          <h5 class="card-title mt-3">Rutinas</h5>

          <p class="card-text">Entrenamiento de hoy</p>

          <button class="btn btn-app" routerLink="/app/rutinas">Ver rutina</button>
        </div>
      </div>
    </div>

    <div class="col-md-6 col-lg-3">
      <div class="card shadow-sm h-100">
        <div class="card-body">
          <i class="bi bi-dumbbell fs-2"></i>

          <h5 class="card-title mt-3">Entrenamientos</h5>

          <p class="card-text">Tu entrenamiento del día</p>

          <button class="btn btn-app" routerLink="/app/entrenamientos">Ver entrenamientos</button>
        </div>
      </div>
    </div>

    <div class="col-md-6 col-lg-3">
      <div class="card shadow-sm h-100">
        <div class="card-body">
          <i class="bi bi-bell-fill fs-2"></i>

          <h5 class="card-title mt-3">Recordatorios</h5>

          <p class="card-text">Próximo recordatorio</p>

          <button class="btn btn-app" routerLink="/app/recordatorios">Ver más</button>
        </div>
      </div>
    </div>
  </div>
</div>
